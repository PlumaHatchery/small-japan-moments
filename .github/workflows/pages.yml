name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required publish files
        run: |
          test -f index.html
          test -f topics.html
          test -f madobe.html
          test -f styles.css
          test -f .nojekyll
          test -d articles
          test -d assets
          test -d ja
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html topics.html madobe.html styles.css _site/
          cp .nojekyll _site/
          cp -R articles _site/articles
          cp -R assets _site/assets
          cp -R ja _site/ja
      - name: Check generated site
        run: |
          find _site -type f | sort
          test -f _site/index.html
          test -f _site/ja/index.html
